name: Build Windows Receiver

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore windows-receiver/RemotePrankReceiver.sln

    - name: Build solution
      run: dotnet build windows-receiver/RemotePrankReceiver.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test windows-receiver/tests/Receiver.Core.Tests/Receiver.Core.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish Receiver.App
      run: >
        dotnet publish windows-receiver/src/Receiver.App/Receiver.App.csproj
        --configuration Release
        --runtime win-x64
        --self-contained false
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        --output ./publish-win

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RemotePrankReceiver-win-x64
        path: ./publish-win/
